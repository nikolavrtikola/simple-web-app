name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/todo-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/todo-backend

jobs:

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  backend-test:
    name: Backend test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci


  docker:
    name: Build and push images
    runs-on: ubuntu-latest

    needs:
      - frontend-test
      - backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest


  update-gitops:
    name: Update GitOps repository
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: nikolavrtikola/todo-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tags
        working-directory: gitops
        run: |
          sed -i \
            "s|frontendTag:.*|frontendTag: \"${GITHUB_SHA}\"|" \
            helm/todo-app/values.yaml

          sed -i \
            "s|backendTag:.*|backendTag: \"${GITHUB_SHA}\"|" \
            helm/todo-app/values.yaml

      - name: Commit changes
        working-directory: gitops
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/todo-app/values.yaml

          git commit \
            -m "Update images to ${GITHUB_SHA}" \
            || echo "No changes"

          git push
          